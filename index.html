<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Monika Adamczyk Fotografia — sesje biznesowe i rodzinne | Ropczyce, Podkarpacie</title>
<meta name="description" content="Monika Adamczyk Fotografia — wybierz styl sesji: fotografia biznesowa i wizerunkowa dla firm, albo sesje rodzinne, śluby i chrzciny (StopMoments). Ropczyce, Podkarpacie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3247;
    --ink:#2E3540;
    --blue:#6E869E;
    --cream:#FBF8F4;
    --paper:#FAF9F7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--navy);
    color:#fff;
    height:100svh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}

  .brandbar{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:center;padding:26px 20px 0;
    pointer-events:none;
  }
  .brandbar .name{
    font-family:'Cormorant Garamond',serif;font-size:1.4rem;letter-spacing:.03em;
    color:#fff;text-align:center;line-height:1.15;
    text-shadow:0 2px 12px rgba(0,0,0,.35);
  }
  .brandbar .name small{
    display:block;font-family:'Montserrat',sans-serif;font-size:.56rem;
    letter-spacing:.32em;font-weight:500;opacity:.85;margin-top:3px;
  }

  .picker{height:100svh;display:flex}
  .panel{
    position:relative;flex:1;overflow:hidden;display:flex;align-items:flex-end;
    transition:flex .5s ease;
  }
  .panel img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:transform .6s ease;
  }
  .panel:hover img{transform:scale(1.04)}
  .panel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,20,26,.15) 0%, rgba(15,20,26,.15) 45%, rgba(15,20,26,.82) 100%);
    z-index:1;
  }
  .panel-content{position:relative;z-index:2;padding:48px;width:100%}
  .panel .eyebrow{
    display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:14px;
  }
  .panel h2{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.9rem,3vw,2.8rem);
    line-height:1.1;margin-bottom:14px;
  }
  .panel p{
    font-size:.92rem;color:rgba(255,255,255,.75);max-width:34ch;line-height:1.6;margin-bottom:20px;
  }
  .panel .cta{
    display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:#fff;
    border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:4px;
    transition:.25s;
  }
  .panel:hover .cta{border-color:#fff;gap:12px}
  .panel .cta svg{width:14px;height:14px;flex-shrink:0}

  .divider{
    position:absolute;top:0;bottom:0;left:50%;width:1px;
    background:rgba(255,255,255,.25);z-index:3;transform:translateX(-.5px);
  }

  @media(max-width:820px){
    body{overflow-y:auto;height:auto}
    .picker{flex-direction:column;height:auto}
    .panel{min-height:52svh}
    .divider{display:none}
    .brandbar{position:absolute;padding-top:22px}
  }
</style>
</head>
<body>

<div class="brandbar">
  <div class="name">Monika Adamczyk<small>FOTOGRAFIA</small></div>
</div>

<div class="picker">
  <a class="panel" href="biznes.html" aria-label="Fotografia biznesowa">
    <img src="img/druga-marka/biznes.jpg" alt="Sesja zespołowa biznesowa">
    <div class="panel-content">
      <span class="eyebrow">Marki i firmy</span>
      <h2>Fotografia biznesowa</h2>
      <p>Sesje wizerunkowe, zespołowe i reportaże z eventów dla firm i marek osobistych.</p>
      <span class="cta">Zobacz ofertę
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </div>
  </a>
  <div class="divider"></div>
  <a class="panel" href="rodzinne.html" aria-label="Sesje rodzinne i okolicznościowe — StopMoments">
    <img src="img/hero/hero-chrzest.jpg" alt="Chrzest — sesja okolicznościowa StopMoments">
    <div class="panel-content">
      <span class="eyebrow">StopMoments</span>
      <h2>Sesje rodzinne i&nbsp;okolicznościowe</h2>
      <p>Chrzciny, śluby, sesje rodzinne, narzeczeńskie, noworodkowe i więcej.</p>
      <span class="cta">Zobacz ofertę
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </div>
  </a>
</div>

</body>
</html>
